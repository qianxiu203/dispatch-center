# 调度中心自动测试（需求 9.1：用 GitHub Actions 的 Windows 环境自动运行测试）
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Chromium 便携下载到调度中心 tools 目录（与运行时一致）
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tools/playwright-browsers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm install

      - name: 构建
        run: npm run build

      - name: 下载验收用 Chromium
        run: npx playwright install chromium

      - name: 运行测试（A1-A10；A5 的真实 codex 任务需要登录环境，CI 自动跳过）
        run: npm test
