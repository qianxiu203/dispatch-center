<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>调度中心</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- 左栏：项目与设置 -->
    <aside id="left">
      <div class="logo">⚙ 调度中心</div>
      <button id="addProjectBtn" class="btn primary block">＋ 新增项目</button>
      <div id="addProjectForm" class="hidden">
        <input id="addProjectInput" type="text" placeholder="输入项目目录路径" />
        <div class="row">
          <button id="addProjectOk" class="btn primary">确定</button>
          <button id="addProjectCancel" class="btn">取消</button>
        </div>
      </div>
      <ul id="projectList"></ul>
      <div class="spacer"></div>
      <button id="settingsBtn" class="btn block">⚙ 设置中心</button>
    </aside>

    <!-- 中栏：聊天 -->
    <main id="middle">
      <div id="projectHeader">
        <span id="currentProjectName">未选择项目</span>
        <span id="runBadge" class="badge hidden">执行中…</span>
      </div>
      <div id="chatScroll">
        <div id="chatMessages"></div>
      </div>
      <form id="chatForm" autocomplete="off">
        <input id="chatInput" type="text" placeholder="向调度中心描述你的需求…" />
        <button id="chatSend" class="btn primary" type="submit">发送</button>
      </form>
    </main>

    <!-- 右栏：执行追踪面板 -->
    <aside id="right">
      <div class="panel">
        <h3>任务时间线</h3>
        <div id="timeline" class="panel-body"><div class="empty">暂无任务</div></div>
      </div>
      <div class="panel">
        <h3 id="workerOutToggle" class="toggle">▸ 工人实时输出</h3>
        <div id="workerOut" class="panel-body collapsed"><div class="empty">暂无输出</div></div>
      </div>
      <div class="panel">
        <h3>验收结果</h3>
        <div id="acceptance" class="panel-body"><div class="empty">暂无验收</div></div>
      </div>
      <div class="panel">
        <h3>控制台报错</h3>
        <div id="consoleErrors" class="panel-body"><div class="empty">暂无报错</div></div>
      </div>
      <div class="panel">
        <h3>自动处理记录</h3>
        <div id="autoLog" class="panel-body"><div class="empty">暂无记录</div></div>
      </div>
    </aside>
  </div>

  <!-- 设置中心 -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2>设置中心</h2>
        <button id="settingsClose" class="btn">关闭</button>
      </div>
      <div class="modal-body">
        <section>
          <h4>大脑（OpenAI 兼容接口）</h4>
          <label>Base URL <input id="cfgBrainUrl" type="text" placeholder="https://api.example.com/v1" /></label>
          <label>API Key <input id="cfgBrainKey" type="password" placeholder="留空表示不修改" /></label>
          <label>模型名 <input id="cfgBrainModel" type="text" /></label>
          <button id="testBrainBtn" class="btn">测试连接</button>
          <span id="testBrainResult"></span>
        </section>
        <section>
          <h4>工人</h4>
          <label>类型
            <select id="cfgWorkerKind">
              <option value="codex">codex</option>
            </select>
          </label>
          <label>可执行文件路径 <input id="cfgWorkerPath" type="text" placeholder="留空自动查找（便携安装优先）" /></label>
          <label>Base URL（可选中转） <input id="cfgWorkerUrl" type="text" placeholder="留空使用工人自己的登录" /></label>
          <label>模型名 <input id="cfgWorkerModel" type="text" /></label>
          <label>API Key <input id="cfgWorkerKey" type="password" placeholder="留空表示不修改" /></label>
        </section>
        <section>
          <h4>权限模式</h4>
          <label>模式
            <select id="cfgPermMode">
              <option value="yolo">YOLO（自动批准，默认）</option>
              <option value="graded">分级询问</option>
            </select>
          </label>
          <div id="ruleList" class="rules"></div>
        </section>
        <section>
          <h4>上限</h4>
          <label>同一错误修复上限（次） <input id="cfgMaxFix" type="number" min="1" /></label>
          <label>单任务总步数上限 <input id="cfgMaxSteps" type="number" min="1" /></label>
          <label>单任务总时长上限（分钟） <input id="cfgMaxMinutes" type="number" min="1" /></label>
        </section>
        <section>
          <h4>环境体检</h4>
          <button id="envcheckBtn" class="btn">重新体检</button>
          <div id="envcheckList"></div>
        </section>
      </div>
      <div class="modal-foot">
        <button id="settingsSave" class="btn primary">保存设置</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/dist/app.js"></script>
</body>
</html>
